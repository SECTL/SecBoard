appId: com.lanstart.secboard
productName: SecBoard
directories:
  output: dist
  buildResources: iconpack
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
  - out/LeavelDB/**/*
npmRebuild: false
extraResources:
  - from: iconpack/SecBoard.png
    to: iconpack/SecBoard.png
  - from: out/ppt-wrapper
    to: ppt-wrapper
publish:
  provider: github
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: appx
      arch:
        - x64
  icon: SecBoard.png
  signAndEditExecutable: false
nsis:
  artifactName: "${productName}-${version}-nsis.${ext}"
appx:
  applicationId: SecBoard
  identityName: LanStart.SecBoard
  publisherDisplayName: LanStart
