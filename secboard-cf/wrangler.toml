name = "secboard-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
node_compat = true

# ---------------------------------------------------------------------------
# D1 Database binding
#
# `database_id` below is a placeholder. Before deploying, replace it with the
# ID returned by:
#
#     pnpm exec wrangler d1 create secboard-db
#
# (or `npx wrangler d1 create secboard-db` / `wrangler d1 create secboard-db`).
# Wrangler prints a UUID such as:
#
#     Created DB 'secboard-db' (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)
#
# Paste that UUID into the `database_id` field below. If you skip this step,
# `wrangler deploy` will fail with an invalid D1 binding error.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "secboard-db"
database_id = "your-database-id-here"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "secboard-files"

[vars]
# Allowed origin for CORS responses. Set to your frontend origin in production
# (e.g. "https://secboard.example.com"). Use "*" to allow any origin (dev only).
ALLOWED_ORIGIN = "*"

[build]
command = ""

[dev]
port = 3131

# ---------------------------------------------------------------------------
# Optional environment overrides.
# Uncomment and customize when you need separate production / staging
# deployments. Each section overrides the top-level bindings/vars.
# ---------------------------------------------------------------------------
# [env.production]
# name = "secboard-api"
#
# [[env.production.d1_databases]]
# binding = "DB"
# database_name = "secboard-db"
# database_id = "your-production-database-id-here"
#
# [[env.production.r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "secboard-files"
#
# [env.production.vars]
# ALLOWED_ORIGIN = "https://secboard.example.com"

# [env.staging]
# name = "secboard-api-staging"
#
# [[env.staging.d1_databases]]
# binding = "DB"
# database_name = "secboard-db"
# database_id = "your-staging-database-id-here"
#
# [[env.staging.r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "secboard-files"
#
# [env.staging.vars]
# ALLOWED_ORIGIN = "https://staging.secboard.example.com"
